name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build, test, lint
        env:
          OOT_ANTIGRAVITY_CLIENT_ID: ${{ secrets.OOT_ANTIGRAVITY_CLIENT_ID }}
          OOT_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.OOT_ANTIGRAVITY_CLIENT_SECRET }}
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --console=plain
      - name: Test release version
        run: bash scripts/test-release-version.sh
      - name: Test OAuth config resolution (fake values)
        run: bash scripts/test-oauth-config.sh
